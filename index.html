<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd TV Browser</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
            text-align: center;
        }
        h1 { font-size: 36px; margin-bottom: 20px; color: #00a8ff; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .btn {
            padding: 20px 40px;
            font-size: 22px;
            background-color: #1f1f1f;
            color: #fff;
            border: 3px solid #333;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:focus, .btn:hover {
            border-color: #00a8ff;
            background-color: #00a8ff;
            color: #000;
            transform: scale(1.08);
            outline: none;
        }
        .frame-box {
            margin-top: 30px;
            width: 100%;
            height: 70vh;
            border: 2px solid #222;
            border-radius: 10px;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>مەتەڵ و پلیەری تایبەتی VIDAA</h1>
    <p>بە دوگمەکانی کۆنترۆڵ لێرەدا بجووڵێوە</p>

    <div class="container">
        <button class="btn" tabindex="1" onclick="loadSite('https://kurdsubtitle.net/movies')">فیلمەکان</button>
        <button class="btn" tabindex="2" onclick="loadSite('https://kurdsubtitle.net/tvshows')">زنجیرەکان</button>
        <button class="btn" tabindex="3" onclick="loadSite('https://kurdsubtitle.net')">لاپەڕەی سەرەکی</button>
    </div>

    <div class="frame-box">
        <iframe id="siteFrame" src="https://kurdsubtitle.net"></iframe>
    </div>

    <script>
        function loadSite(url) {
            document.getElementById('siteFrame').src = url;
        }

        document.addEventListener('keydown', function(e) {
            if(e.keyCode == 13) {
                if(document.activeElement && document.activeElement.click) {
                    document.activeElement.click();
                }
            }
        });
    </script>
</body>
</html>
